[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvat-automation-qa"
version = "0.1.0"
description = "Automated quality checks for CVAT annotation exports"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["cvat_qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
