name: CVAT QA Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: pip install -r requirements.txt

      - name: Run validator tests
        run: pytest -v

      - name: Validate clean sample
        run: python -m cvat_qa.cli sample_data/annotations_valid.xml
